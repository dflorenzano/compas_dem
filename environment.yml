name: dem-dev
channels:
  - conda-forge
dependencies:
  - python
  - pip
  - compas >=2.8.1
  # 3.14.9 (conda-forge build h843a782_1 on osx-arm64) ships the library without the
  # `ipopt` executable, which is what pyomo shells out to. CRA and RBE then fail at
  # solve time with "No executable found for solver 'ipopt'".
  - ipopt >=3.14.13
  - pyomo ==6.4.2
  - numpy <2.0
  - pip:
      - -r requirements-dev.txt
      - -r requirements-viz.txt
      - -r requirements-analysis.txt
      - -e .
